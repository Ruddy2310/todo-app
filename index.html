<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do List — Rudra Soni</title>
<style>
:root{--bg:#eef6c9;--card:#fffefa;--ink:#1b1a18;--mute:#77735f;--acc:#ff5a36;--line:#e7e2cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a0e;--card:#212516;--ink:#f1f3e3;--mute:#a7ab8e;--line:#32371f}}
:root[data-theme="dark"]{--bg:#171a0e;--card:#212516;--ink:#f1f3e3;--mute:#a7ab8e;--line:#32371f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:start center;padding:40px 20px}
main{width:100%;max-width:480px}
h1{font-size:28px;margin-bottom:4px}.sub{color:var(--mute);font-size:14px;margin-bottom:18px}
form{display:flex;gap:8px}
input[type=text]{flex:1;font:inherit;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.add{background:var(--ink);color:var(--bg);padding:12px 20px}
.tabs{display:flex;gap:6px;margin:16px 0}.tabs button{background:none;color:var(--mute);padding:4px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px}.tabs .on{background:var(--ink);color:var(--bg)}
ul{list-style:none;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
li.done .tx{text-decoration:line-through;color:var(--mute)}
.tx{flex:1;min-width:0;word-break:break-word}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
li input[type=text]{padding:6px 10px}
.ib{background:none;color:var(--mute);padding:4px 8px;font-size:14px}.ib:hover{color:var(--acc)}
.foot{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:10px}
.empty{text-align:center;color:var(--mute);padding:24px}
</style></head><body><main>
<h1>✓ To-Do List</h1><p class="sub">Add, edit and delete tasks. Saved in your browser.</p>
<form id="f"><input type="text" id="in" placeholder="What needs doing?" autocomplete="off"><button class="add">Add</button></form>
<div class="tabs" id="tabs"><button data-f="all" class="on">All</button><button data-f="active">Active</button><button data-f="done">Done</button></div>
<ul id="list"></ul>
<div class="foot"><span id="cnt"></span><button class="ib" id="clr">Clear done</button></div>
<p class="foot" style="justify-content:center">Built by Rudra Soni · JavaScript, CSS, Local Storage</p>
</main>
<script>
var T=[],F="all",E=null;
try{T=JSON.parse(localStorage.getItem("todos")||"[]")}catch(e){T=[]}
if(!T.length)T=[{id:1,t:"Design hero section",d:true},{id:2,t:"Test layout on mobile",d:false}];
function save(){try{localStorage.setItem("todos",JSON.stringify(T))}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function draw(){
  var l=T.filter(function(x){return F=="all"||(F=="done")==x.d});
  document.getElementById("list").innerHTML=l.length?l.map(function(x){
    return '<li class="'+(x.d?"done":"")+'"><input type="checkbox" '+(x.d?"checked":"")+' data-a="tg" data-i="'+x.id+'">'+
    (E==x.id?'<input type="text" id="ed" value="'+esc(x.t)+'">':'<span class="tx">'+esc(x.t)+'</span>')+
    '<button class="ib" data-a="'+(E==x.id?"sv":"ed")+'" data-i="'+x.id+'">'+(E==x.id?"Save":"Edit")+'</button><button class="ib" data-a="rm" data-i="'+x.id+'">✕</button></li>'}).join(""):'<li class="empty" style="display:block">Nothing here yet.</li>';
  document.getElementById("cnt").textContent=T.filter(function(x){return!x.d}).length+" left";
  var e=document.getElementById("ed");if(e)e.focus();
}
document.getElementById("f").onsubmit=function(e){e.preventDefault();var i=document.getElementById("in"),v=i.value.trim();if(!v)return;T.push({id:Date.now(),t:v,d:false});i.value="";save();draw()};
document.getElementById("list").onclick=function(e){var b=e.target.closest("[data-a]");if(!b)return;var id=+b.dataset.i,a=b.dataset.a,x=T.filter(function(t){return t.id==id})[0];
  if(a=="tg")x.d=!x.d;else if(a=="rm")T=T.filter(function(t){return t.id!=id});else if(a=="ed")E=id;else if(a=="sv"){var v=document.getElementById("ed").value.trim();if(v)x.t=v;E=null}
  save();draw()};
document.getElementById("tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;F=b.dataset.f;this.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x==b)});draw()};
document.getElementById("clr").onclick=function(){T=T.filter(function(t){return!t.d});save();draw()};
draw();
</script></body></html>
